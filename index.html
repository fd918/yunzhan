<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="云瞻开放平台业务体系介绍与 GEO 运营策略看板。" />
  <title>云瞻开放平台看板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #fff; }
    .dashboard-shell { position: relative; width: 100%; height: 100%; }
    .dashboard-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .dashboard-frame[hidden] { display: none; }
    .dashboard-switcher {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: calc(100% - 24px);
      padding: 5px;
      border: 1px solid rgba(148, 163, 184, .32);
      border-radius: 16px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 12px 36px rgba(15, 23, 42, .18);
      backdrop-filter: blur(12px);
      transform: translateX(-50%);
    }
    .dashboard-switcher-title {
      padding: 0 9px;
      color: #64748b;
      font: 700 12px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
      white-space: nowrap;
    }
    .dashboard-switcher button {
      border: 0;
      border-radius: 11px;
      padding: 9px 13px;
      background: transparent;
      color: #475569;
      cursor: pointer;
      font: 700 13px/1 "Microsoft YaHei", "PingFang SC", sans-serif;
      white-space: nowrap;
    }
    .dashboard-switcher button:hover { color: #2563eb; background: #eff6ff; }
    .dashboard-switcher button[aria-pressed="true"] {
      color: #fff;
      background: #2563eb;
      box-shadow: 0 5px 14px rgba(37, 99, 235, .24);
    }
    .dashboard-switcher button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .3);
      outline-offset: 2px;
    }
    @media (max-width: 520px) {
      .dashboard-switcher { width: calc(100% - 24px); justify-content: center; }
      .dashboard-switcher-title { display: none; }
      .dashboard-switcher button { flex: 1; padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="dashboard-shell">
    <iframe class="dashboard-frame" data-dashboard="overview" src="./yunzhan.html" title="云瞻开放平台与业务体系介绍"></iframe>
    <iframe class="dashboard-frame" data-dashboard="geo" src="./geo-strategy-dashboard.html" title="云瞻开放平台 GEO 运营策略看板" hidden></iframe>
    <nav class="dashboard-switcher" aria-label="看板切换">
      <span class="dashboard-switcher-title">云瞻看板</span>
      <button type="button" data-target="overview" aria-pressed="true">平台介绍</button>
      <button type="button" data-target="geo" aria-pressed="false">GEO 运营策略</button>
    </nav>
  </main>
  <script>
    const frames = [...document.querySelectorAll("[data-dashboard]")];
    const buttons = [...document.querySelectorAll("[data-target]")];

    function showDashboard(id, updateAddress = true) {
      const activeId = id === "geo" ? "geo" : "overview";
      frames.forEach((frame) => { frame.hidden = frame.dataset.dashboard !== activeId; });
      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.target === activeId));
      });

      if (updateAddress) {
        const url = new URL(window.location.href);
        if (activeId === "geo") url.searchParams.set("dashboard", "geo");
        else url.searchParams.delete("dashboard");
        window.history.replaceState(null, "", url);
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => showDashboard(button.dataset.target));
    });

    showDashboard(new URLSearchParams(window.location.search).get("dashboard"), false);
  </script>
</body>
</html>
